# 能源审计工具配置文件
# 注意：本文件只存非密配置。数据库密码请通过以下任一方式提供：
#   1. 环境变量 EA_PG_PASSWORD（或 DB_PASSWORD）
#   2. Hermes 全局 config.yaml → energy_audit.database.password
# 解析逻辑见 db_config.py。

# PostgreSQL数据库配置
database:
  host: "10.10.1.165"
  port: "5432"
  database: "dc_energy_audit2"
  user: "postgres"
  sslmode: "prefer"

# 文件服务配置：用于把 ts_attachment.attach_url 相对路径（如 /20260803/xxx.png）
# 拼成完整 URL，供附件解析（management_files / award_certificate 文件ID → 图片）。
# 采用「查库拿相对路径 + 文件服务器 IP 直连」方式，无需 web 接口 token。
#   base_url：完整前缀（含 scheme://host[:port]），优先级最高。
#   scheme/host/port：base_url 未填时按此拼接；host 留空则复用 database.host。
#   仅当显式配置了 base_url 或 host/port 之一才启用；否则跳过附件解析。
#   支持环境变量：EA_FILE_BASE_URL / EA_FILE_SCHEME / EA_FILE_HOST / EA_FILE_PORT。
file:
  base_url: "https://eademo.bmscloud.top/images/"
  scheme: "http"
  host: ""     # 留空 → 复用 database.host (10.10.1.165)
  port: ""     # 文件服务器端口，例如 80 / 8080 / 9000

# RAG：与 Desktop 知识库共用 Hermes config.yaml → knowledge_base:
#   qdrant_host / qdrant_port / summary_model / energy_audit_collection
# 本段仅在没有 Hermes 环境、独立跑审计工具时作为最后兜底（不要写局域网 IP）。
rag:
  collection_name: "knowledge_segment_qwen"
  qdrant_url: "http://127.0.0.1:6333"
  deepseek_model: "deepseek-v4-flash"

# 报告输出配置
output:
  format: "markdown"
  directory: "./reports"
  filename_template: "{audit_type}能源审计报告_{date}"

# 审计类型配置
audit_types:
  公共机构:
    chapters:
      - "能源审计执行概要"
      - "公共机构单位概况"
      - "能源资源管理状况"
      - "能源资源计量及统计状况"
      - "能源资源消费/消耗指标分析"
      - "主要能源资源利用系统分析"
      - "节能效果与节能潜力分析"
      - "审计结论"
  公共建筑:
    chapters:
      - "审计执行概要"
      - "建筑概况"
      - "能源管理状况"
      - "能源计量与统计"
      - "能源消耗分析"
      - "能源系统分析"
      - "节能潜力分析"
      - "审计结论与建议"
  工业企业:
    chapters:
      - "审计执行概要"
      - "企业概况"
      - "能源管理状况"
      - "能源计量与统计"
      - "能源消耗分析"
      - "主要用能系统分析"
      - "节能潜力分析"
      - "审计结论与建议"

# 能耗指标计算
indicators:
  人均综合能耗:
    formula: "综合能耗总量 / 用能人数"
    unit: "tce/人"
  单位建筑面积能耗:
    formula: "综合能耗总量 / 建筑面积"
    unit: "tce/m²"
  单位建筑面积电耗:
    formula: "电力消耗量 / 建筑面积"
    unit: "kWh/m²"
  人均电耗:
    formula: "电力消耗量 / 用能人数"
    unit: "kWh/人"
